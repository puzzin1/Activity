# Конфигурация программы симуляции активности
# Все параметры настраиваются здесь и загружаются при запуске

# ============================================================================
# ОСНОВНЫЕ ПАРАМЕТРЫ СИМУЛЯЦИИ
# ============================================================================

# Минимальное время бездействия пользователя (в секундах), после которого
# начнется симуляция активности. Чем меньше значение, тем быстрее программа
# начнет имитировать активность при отсутствии действий пользователя.
# Рекомендуется: 25-40 секунд
min_idle_time: 30

# Максимальное время бездействия (в секундах) перед началом симуляции.
# Программа случайным образом выбирает порог между min и max для каждого
# цикла, что делает поведение более естественным и непредсказуемым.
# Рекомендуется: 60-90 секунд
max_idle_time: 70

# Минимальный интервал (в секундах) между симулированными действиями.
# Определяет, как часто будут выполняться действия во время симуляции.
# Слишком малое значение может выглядеть неестественно.
# Рекомендуется: 2-5 секунд
min_action_interval: 3

# Максимальный интервал (в секундах) между симулированными действиями.
# Программа выбирает случайный интервал между min и max для каждого действия.
# Рекомендуется: 15-30 секунд
max_action_interval: 20

# ============================================================================
# ПАРАМЕТРЫ ДВИЖЕНИЯ МЫШИ
# ============================================================================

# Максимальное расстояние (в пикселях), на которое мышь может переместиться
# от начальной точки симуляции. Это ограничивает "дрифт" курсора и предотвращает
# его уход за пределы экрана или в нежелательные области.
# Рекомендуется: 30-80 пикселей
max_mouse_range: 50

# Длительность (в секундах) плавного перемещения мыши от начальной точки
# до целевой. Большее значение делает движение более медленным и плавным.
# Рекомендуется: 0.5-1.2 секунды
smooth_move_duration: 0.8

# Количество промежуточных шагов при плавном перемещении мыши.
# Большее количество шагов делает движение более плавным, но требует
# больше процессорного времени. Оптимальное значение: 30-60 шагов.
smooth_move_steps: 40

# ============================================================================
# ПАРАМЕТРЫ КЛАВИАТУРЫ
# ============================================================================

# Минимальное количество повторных нажатий клавиши-стрелки за один вызов.
# Используется для имитации прокрутки страницы или навигации.
# Рекомендуется: 1-3
min_key_presses: 1

# Максимальное количество повторных нажатий клавиши-стрелки.
# Слишком большое значение может привести к непредсказуемому поведению
# в некоторых приложениях (например, прокрутка на несколько страниц).
# Рекомендуется: 10-25
max_key_presses: 20

# ============================================================================
# ВКЛЮЧЕНИЕ/ВЫКЛЮЧЕНИЕ ТИПОВ ДЕЙСТВИЙ
# ============================================================================

# Включить/выключить движение мыши.
# True - мышь будет двигаться в пределах заданного диапазона
# False - движение мыши отключено
use_mouse_move: true

# Включить/выключить нажатие клавиш клавиатуры (стрелки, Ctrl+Tab).
# True - будут нажиматься клавиши-стрелки и Ctrl+Tab
# False - клавиатура не используется (кроме безопасных клавиш)
use_keyboard: true

# Включить/выключить клики мыши.
# ВНИМАНИЕ: клики могут активировать элементы интерфейса!
# True - будут выполняться клики левой кнопкой мыши
# False - клики отключены (рекомендуется для безопасности)
use_mouse_click: true

# Включить/выключить режим естественного поведения.
# True - добавляет вариативность в движения, паузы и действия
# False - более механическое и предсказуемое поведение
natural_behavior: true

# Включить/выключить подробное логирование.
# True - все действия записываются в лог-файл и выводятся в консоль
# False - минимальный вывод, только ошибки
verbose_logging: true

# Блокировать компьютер при завершении программы.
# True - компьютер будет заблокирован при завершении работы или остановке Ctrl+C
# False - программа просто завершится без блокировки
# ВАЖНО: Блокировка происходит как при автоматическом завершении в конце
# рабочего дня, так и при ручной остановке через Ctrl+C
lock_on_exit: true

# Принудительно выключить компьютер при завершении программы (без запроса).
# True - компьютер будет выключен при завершении работы
# False - только блокировка (если включена) или просто завершение программы
# ВНИМАНИЕ: Выключение происходит БЕЗ ЗАПРОСА ПОДТВЕРЖДЕНИЯ!
# Если shutdown_on_exit = True, то lock_on_exit игнорируется.
# Рекомендуется: False (для безопасности)
shutdown_on_exit: false

# Показывать предупреждение перед выключением/блокировкой компьютера.
# True - показывается всплывающее окно с возможностью отмены
# False - выключение/блокировка происходит сразу без предупреждения
# Рекомендуется: True (для безопасности)
show_shutdown_warning: true

# Время (в секундах) до автоматического выключения/блокировки после показа предупреждения.
# За это время пользователь может нажать кнопку "Отменить" в окне предупреждения.
# Если кнопка не нажата, выключение/блокировка произойдет автоматически.
# Рекомендуется: 20-60 секунд
shutdown_warning_time: 30

# Завершать программу при обнаружении активности пользователя после рабочего дня.
# True - если пользователь двигает мышью/нажимает клавиши после окончания работы,
#        программа завершается БЕЗ блокировки/выключения компьютера
# False - программа продолжает работать или выключает/блокирует компьютер как обычно
# Полезно, если пользователь решил продолжить работу после окончания рабочего дня.
# Рекомендуется: True
exit_on_activity_after_work: true

# ============================================================================
# ДЕЙСТВИЯ ПОСЛЕ ОБЕДА
# ============================================================================

# Включить/выключить автоматический ввод последовательности клавиш после обеда.
# True - после окончания обеденного перерыва будет введена последовательность
# False - никаких действий после обеда не выполняется
after_lunch_action: false

# Последовательность клавиш для ввода после обеденного перерыва.
# Может содержать обычные символы и специальные клавиши в фигурных скобках.
#
# Поддерживаемые специальные клавиши:
#   {Enter} - клавиша Enter
#   {Tab} - клавиша Tab
#   {Space} - пробел (можно также использовать обычный пробел)
#
# Примеры:
#   'mypassword{Enter}' - вводит пароль и нажимает Enter
#   'username{Tab}password{Enter}' - вводит логин, Tab, пароль, Enter
#   'admin{Tab}{Tab}12345{Enter}' - admin, два Tab, пароль, Enter
#
# ВНИМАНИЕ: Храните пароли в безопасности! Этот файл содержит открытый текст.
after_lunch_sequence: 'password123{Tab}password456{Enter}'

# Задержка (в секундах) после окончания обеда перед вводом последовательности.
# Дает время для активации нужного окна или поля ввода.
# Рекомендуется: 3-10 секунд
after_lunch_delay: 5

# ============================================================================
# ВЕСА ДЕЙСТВИЙ (для случайного выбора)
# ============================================================================
# Чем больше вес, тем чаще будет выбрано это действие.
# Например, вес 3 означает, что действие будет выбрано в 3 раза чаще,
# чем действие с весом 1. Можно использовать 0 для полного отключения.

# Вес для движения мыши. Движение мыши - самое безопасное действие.
# Рекомендуется: 2-5
action_weight_mouse_move: 3

# Вес для нажатия клавиш-стрелок (прокрутка). Может влиять на контент.
# Рекомендуется: 2-4
action_weight_keyboard: 3

# Вес для нажатия Ctrl+Tab (переключение вкладок). Может менять активное окно.
# Рекомендуется: 0-2 (меньший вес для осторожности)
action_weight_ctrl_tab: 1

# Вес для кликов мыши. ВНИМАНИЕ: может активировать кнопки/ссылки!
# Рекомендуется: 0-2 (0 для максимальной безопасности)
action_weight_mouse_click: 2

# Вес для безопасных клавиш (Shift). Не производит побочных эффектов.
# Рекомендуется: 1-3
action_weight_safe_key: 2

# ============================================================================
# РАСПИСАНИЕ РАБОЧЕГО ДНЯ
# ============================================================================

# Самое раннее время начала рабочего дня (формат 'ЧЧ:ММ').
# Программа выберет случайное время между work_start_min и work_start_max.
work_start_min: '08:45'

# Самое позднее время начала рабочего дня (формат 'ЧЧ:ММ').
# Создает эффект естественного прихода на работу "не минута в минуту".
work_start_max: '09:05'

# Самое раннее время окончания рабочего дня (формат 'ЧЧ:ММ').
work_end_min: '18:00'

# Самое позднее время окончания рабочего дня (формат 'ЧЧ:ММ').
# Имитирует естественный уход с работы в разное время.
work_end_max: '18:20'

# --- СПЕЦИАЛЬНОЕ РАСПИСАНИЕ ДЛЯ ПЯТНИЦЫ ---
# Самое раннее время окончания рабочего дня в ПЯТНИЦУ (формат 'ЧЧ:ММ').
# По пятницам рабочий день обычно короче.
friday_work_end_min: '16:35'

# Самое позднее время окончания рабочего дня в ПЯТНИЦУ (формат 'ЧЧ:ММ').
# Создает вариативность ухода с работы в пятницу.
friday_work_end_max: '16:55'

# ============================================================================
# ПЕРЕРЫВЫ
# ============================================================================

# Самое раннее время начала обеденного перерыва (формат 'ЧЧ:ММ').
lunch_start_min: '12:00'

# Самое позднее время окончания обеденного перерыва (формат 'ЧЧ:ММ').
# Обед будет запланирован в этом диапазоне.
lunch_end_max: '14:30'

# Минимальное общее время перерывов за день (в минутах), включая обед.
# Имитирует короткие перерывы на туалет, кофе и т.д.
total_break_min: 40

# Максимальное общее время перерывов за день (в минутах).
# Программа случайно распределит это время между обедом и короткими перерывами.
total_break_max: 80

# Минимальная продолжительность обеденного перерыва (в минутах).
lunch_duration_min: 20

# Максимальная продолжительность обеденного перерыва (в минутах).
lunch_duration_max: 30

# ============================================================================
# ВНЕРАБОЧИЙ РЕЖИМ (до/после работы)
# ============================================================================

# Режим активности вне рабочего времени. Возможные значения:
# 'disabled' - активность полностью отключена вне рабочих часов
# 'before_only' - активность только ДО начала рабочего дня
# 'before_and_after' - активность и ДО, и ПОСЛЕ рабочего дня
# Рекомендуется: 'before_only' или 'before_and_after'
afterhours_mode: 'before_only'

# Минимальная продолжительность всплеска активности вне рабочего времени (в секундах).
# Всплеск - это короткий период имитации активности.
afterhours_burst_duration_min: 30

# Максимальная продолжительность всплеска активности (в секундах).
afterhours_burst_duration_max: 70

# Минимальный интервал между всплесками активности (в минутах).
# Определяет, как часто будут происходить всплески вне рабочего времени.
afterhours_burst_interval_min: 7

# Максимальный интервал между всплесками активности (в минутах).
# Программа случайно выберет интервал в этом диапазоне.
afterhours_burst_interval_max: 9

# ============================================================================
# РОТАЦИЯ ФАЙЛОВ
# ============================================================================

# Максимальное количество сохраняемых лог-файлов.
# Старые файлы будут автоматически удаляться при превышении лимита.
# 0 = без ограничений (ротация отключена)
max_log_files: 5

# Максимальное количество сохраняемых файлов конфигурации.
# Старые файлы будут автоматически удаляться при превышении лимита.
# 0 = без ограничений (ротация отключена)
max_config_files: 5